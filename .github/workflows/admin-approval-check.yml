name: Verify Admin Approval

on:
  pull_request_review:
    types: [submitted, dismissed]

jobs:
  verify-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Check Approver Role
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;

            // 1. Fetch all reviews (using paginate to avoid missing data)
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            // 2. Group reviews by user to determine their final/latest state
            const latestReviews = {};
            for (const review of reviews) {
              latestReviews[review.user.login] = review;
            }

            // 3. Filter for users whose final active state is 'APPROVED'
            const activeApprovals = Object.values(latestReviews).filter(
              review => review.state === 'APPROVED'
            );

            if (activeApprovals.length === 0) {
              core.setFailed("PR requires at least one active approval.");
              return;
            }

            // 4. Verify user permissions explicitly via the Collaborators API
            let approvedByAdmin = false;
            
            for (const approval of activeApprovals) {
              const username = approval.user.login;
            
              try {
                const { data: permissionData } = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  username: username,
                });
            
                // Permission can be 'admin', 'write', 'read', or 'none'
                if (permissionData.permission === 'admin') {
                  approvedByAdmin = true;
                  console.log(`Valid Admin approval found from user: ${username}`);
                  break; 
                }
              } catch (err) {
                console.log(`Could not fetch permissions for ${username}:`, err.message);
              }
            }

            if (!approvedByAdmin) {
              core.setFailed("PR was approved, but it strictly requires a Repository Admin or Owner approval to merge.");
            }