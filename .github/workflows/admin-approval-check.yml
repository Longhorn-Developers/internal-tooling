name: Verify Admin Approval

on:
  pull_request_review:
    types: [submitted, dismissed]

jobs:
  verify-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Check Approver Role
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;

            // Fetch the review history
            const reviews = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            // Group reviews by user to determine their final/latest state
            const latestReviews = {};
            for (const review of reviews.data) {
              latestReviews[review.user.login] = review;
            }

            // Filter for users whose final active state is 'APPROVED'
            const activeApprovals = Object.values(latestReviews).filter(
              review => review.state === 'APPROVED'
            );

            if (activeApprovals.length === 0) {
              core.setFailed("PR requires at least one active approval.");
              return;
            }

            // Check if any of the active approvals are from an ADMIN or OWNER
            const approvedByAdmin = activeApprovals.some(
              (review) => ['ADMIN', 'OWNER'].includes(review.author_association)
            );

            if (!approvedByAdmin) {
              core.setFailed("PR was approved by a standard user, but it strictly requires a Repository Admin approval to merge.");
            } else {
              console.log("Valid Admin/Owner approval found!");
            }